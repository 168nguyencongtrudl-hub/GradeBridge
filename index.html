<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var desc = Object.getOwnPropertyDescriptor(window, 'fetch') ||
            Object.getOwnPropertyDescriptor(Object.getPrototypeOf(window), 'fetch');
          if (desc && desc.get && !desc.set && desc.configurable !== false) {
            var nativeFetch = desc.get.call(window);
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function () {
                return nativeFetch;
              },
              set: function () {
                // Prevent TypeError when browser extensions attempt to overwrite getter-only window.fetch
              }
            });
          }
        } catch (_err) {}

        window.addEventListener(
          'error',
          function (e) {
            var src = (e && e.filename) || '';
            var msg = (e && e.message) || '';
            if (
              src.indexOf('chrome-extension://') === 0 ||
              msg.indexOf('Cannot set property fetch of #<Window>') !== -1
            ) {
              e.stopImmediatePropagation();
              e.preventDefault();
            }
          },
          true
        );
      })();
    </script>
